name: Update menus and deploy

on:
  schedule:
    # 05:00 UTC on weekdays = 07:00 Stockholm (summer) / 06:00 (winter).
    # Weekdays rather than Mondays only: several restaurants publish the new
    # week late (Le Comptoir and Mercado Mexico were still showing the previous
    # week mid-week), so a daily run picks up the stragglers. For a weekly run
    # instead, change this to "0 5 * * 1".
    - cron: "0 5 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:      # lets you trigger a refresh by hand from the Actions tab

permissions:
  contents: write         # to commit the refreshed data.json
  pages: write
  id-token: write

# Never let a scheduled refresh and a push deploy race each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.upload.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Not fatal: if scraping fails, the committed data.json from the last good
      # run still deploys, so the site stays up with last week's menus rather
      # than going blank. The job is failed at the end so the run still goes red.
      - name: Scrape this week's menus
        id: scrape
        continue-on-error: true
        run: python -m scraper.main

      - name: Run tests
        id: tests
        continue-on-error: true
        run: python -m pytest -q

      - name: Commit refreshed menus
        if: steps.scrape.outcome == 'success'
        run: |
          if git diff --quiet -- site/data.json; then
            echo "menus unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          git commit -m "Menus for week $(date -u +%V)"
          git push

      # enablement turns Pages on via the API if it is off, so the repo needs no
      # manual Settings step. Harmless when Pages is already enabled.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Report scrape/test failures
        if: steps.scrape.outcome != 'success' || steps.tests.outcome != 'success'
        run: |
          echo "scrape: ${{ steps.scrape.outcome }}, tests: ${{ steps.tests.outcome }}"
          echo "The previous good data.json was deployed instead." >> $GITHUB_STEP_SUMMARY
          exit 1

  deploy:
    # Runs even when the build job failed, so a bad scrape never takes the site
    # offline — it just leaves the last good menus published. Requires the
    # artifact to actually exist, so a failure BEFORE the upload (Pages not
    # configured, say) does not add a second, confusing deploy failure.
    needs: build
    if: always() && needs.build.outputs.artifact == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
