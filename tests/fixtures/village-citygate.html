        <header>
            <h1>Village Citygate - gemenskap, innovation och h&#xE5;llbarhet</h1>
        </header>

            <p>Hos Village Konferens och Restaurang uppt&#xE4;cker du unika arbetsytor, h&#xE5;llbara matval och inspirerande evenemang. Dyk in i v&#xE5;r v&#xE4;rld av harmoni och kreativitet.</p>


        <section>
            <h2>Lunch</h2>



<article>
    <h3>
        <time datetime="2026-09-14">M&#xE5;ndag 14.9.2026</time>
    </h3>

        <p>Lunch serveras 11.00&#x2013;13.30</p>

        <div>
            <p>Indisk Tikka Masala med blomk&aring;l, kik&auml;rtor, ingef&auml;ra, tomat och basmatiris</p>
<p>&nbsp;</p>
<p>Sticky Korean Chicken med gochujang, gurksallad, spetsk&aring;l, sesam, ingef&auml;ra och ris</p>
<p>&nbsp;</p>
<p>Grillad pluma med medelhavssallad, basilikakr&auml;m och rostad potatis</p>
        </div>
</article>

<article>
    <h3>
        <time datetime="2026-09-15">Tisdag 15.9.2026</time>
    </h3>

        <p>Lunch serveras 11.00&#x2013;13.30</p>

        <div>
            <p>Okonomiyaki &rdquo;Japansk k&aring;lpannkaka&rdquo; med sesamstr&ouml;ssel, chilimajo och salladsl&ouml;k</p>
<p>&nbsp;</p>
<p>Kycklingl&aring;rfil&eacute; med Ancho-BBQ-s&aring;s, kr&auml;mig &auml;ppelk&aring;lsallad och klyftpotatis</p>

<p>Laxfil&eacute; &rdquo;l&auml;ttbakad&rdquo; med fetaost, dill, citron, gratinerad potatis och lagrad ost</p>
        </div>
</article>

<article>

        <time datetime="2026-09-16">Onsdag 16.9.2026</time>
    </h3>

        <p>Lunch serveras 11.00&#x2013;13.30</p>

        <div>
            <p>Kik&auml;rtsfritters med sesamdipp, syrlig gurk- och myntasallad, granat&auml;pple och kryddigt ris</p>
<p>&nbsp;</p>
<p>Chilir&auml;kor &rdquo;Fried Rice&rdquo; med &auml;gg, broccoli, morot, sambal badjak, koriander och limekr&auml;m</p>
<p>&nbsp;</p>
<p>Fl&auml;skkarr&eacute; &rdquo;Grillad&rdquo; med kr&auml;mig vitl&ouml;kss&aring;s, zucchinisallad och rostad potatis</p>
        </div>
</article>

<article>

        <div>

<p>&nbsp;</p>

        </div>
